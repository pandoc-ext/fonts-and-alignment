to: native
standalone: true
columns: 30

filters:
  - type: lua
    path: fonts-and-alignment.lua

pdf-engine: lualatex

# These variables control the LaTeX/PDF output natively
# and are picked up by your Lua filter for the HTML CSS injection.
variables:
  fontsize: 12pt
  mainfont: Noto Serif
  sansfont: Noto Sans
  monofont: Fira Mono
  papersize: A4
  geometry:
    - margin=20mm
  linestretch: 1.25
  monofontoptions:
    - Scale=0.9
  colorlinks: true
  linkcolor: blue
  urlcolor: blue
  citecolor: blue

metadata:
  author: Nandakumar Chandrasekhar
  date: 2026-05-25
